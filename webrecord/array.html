<!DOCTYPE html>
<html>
<head>
<script>
    let userInput = prompt("Enter the number (0-2):");
    let fruits = ["Apple", "Banana", "Cat"];
    
    let index = Number(userInput);

    if (index >= 0 && index < fruits.length) {
        document.write("You selected: " + fruits[index]);
    } else {
        document.write("Invalid choice!");
    }
</script>
</head>
<body>
    <p>blaahhh</p>
</body>
</html>
