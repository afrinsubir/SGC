<script>
    let userInput=prompt("enter the mark:");
    let marks=Number(userInput)
    document.write("the marks is:" + marks);

        alert("GRADE:A");
    }
    else if(marks >= 80){
        alert("GRADE:B");
    }
    else if(marks >= 70 ){

    }
    else if (marks >= 40){
        alert("FAAAAAAAAAAAAAH");
    }
    else{
        alert("nothing");
    }
</script>
